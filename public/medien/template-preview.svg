<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Beispielbild für die Templatevorschau</title>
  <desc id="description">Abstrakte Quizgrafik mit Fragezeichen und farbigen Karten.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="48" fill="url(#background)"/>
  <circle cx="220" cy="150" r="110" fill="#38e8ff" opacity=".28"/>
  <circle cx="1020" cy="530" r="150" fill="#ff3bd4" opacity=".24"/>
  <rect x="150" y="135" width="900" height="405" rx="40" fill="#020617" stroke="#38e8ff" stroke-width="8"/>
  <text x="600" y="400" text-anchor="middle" fill="#ffd83b" font-family="Arial, sans-serif" font-size="250" font-weight="900">?</text>
</svg>
