name: Production Preflight Safety
on:
  push:
    paths: ['scripts/operations/**', '.github/workflows/production-*preflight*.yml']
  pull_request:
    paths: ['scripts/operations/**', '.github/workflows/production-*preflight*.yml']
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: preflight_ci
          POSTGRES_PASSWORD: isolated-only
          POSTGRES_DB: preflight_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --test scripts/operations/production-preflight.test.ts scripts/operations/production-preflight.integration.test.ts scripts/operations/deployment-scope.test.ts
        env:
          CI: 'true'
          PREFLIGHT_TEST_DATABASE_URL: postgresql://preflight_ci:isolated-only@127.0.0.1:5432/preflight_ci
