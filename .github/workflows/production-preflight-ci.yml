name: Production Preflight Safety
on:
  push:
    paths: ['scripts/operations/**', '.github/workflows/production-*preflight*.yml']
  pull_request:
    paths: ['scripts/operations/**', '.github/workflows/production-*preflight*.yml']
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: preflight_ci
          POSTGRES_PASSWORD: isolated-only
          POSTGRES_DB: preflight_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx --test --test-concurrency=1 scripts/operations/production-preflight.test.ts scripts/operations/production-preflight.integration.test.ts scripts/operations/deployment-scope.test.ts scripts/operations/production-preflight-schema.integration.test.ts
        env:
          CI: 'true'
          PREFLIGHT_TEST_DATABASE_URL: postgresql://preflight_ci:isolated-only@127.0.0.1:5432/preflight_ci
      - name: Build independent schema reference, delta proof and separate new-install result in network-isolated PostgreSQL
        env:
          EXPECTED_PRODUCTION_SHA: 2258c182e68c40a54fbdc4f0a855c9a7306d1a10
        run: |
          git fetch --no-tags origin "$EXPECTED_PRODUCTION_SHA" 912cd86e70ec51f15a8028c3f34fbe3e86f5fc69 b7666e1a3e4fcbe1aec4e7884a30b3603e25b151
          node --import tsx scripts/operations/production-preflight-schema-build.ts
      - uses: actions/upload-artifact@v4
        with:
          name: schema-reference-proof
          path: |
            expected-schema.json
            delta-test.json
            new-install-replay.json
          if-no-files-found: error
