name: Production – Read-only Preflight
on:
  push:
    paths: ['.github/workflows/production-read-only-preflight.yml']
  workflow_dispatch:
    inputs:
      release_candidate_sha:
        description: Exact approved release candidate SHA (migration files only, never executed)
        type: string
        required: true
      expected_production_sha:
        description: Independently expected currently deployed Production SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deployment-metadata:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'justphilgud/pubquiz-web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify current Production target and alias using GET only
        env:
          PREFLIGHT_ENVIRONMENT: production
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          RELEASE_CANDIDATE_SHA: ${{ inputs.release_candidate_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: node --import tsx scripts/operations/production-preflight-cli.ts deployment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-preflight-deployment
          path: preflight-*.json
          if-no-files-found: error
          retention-days: 14
  migrations:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'justphilgud/pubquiz-web' && github.ref == 'refs/heads/main'
    needs: deployment-metadata
    runs-on: ubuntu-latest
    environment: operations-backup
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch immutable manifests without executing candidate code
        env:
          CANDIDATE: ${{ inputs.release_candidate_sha }}
          BASELINE: ${{ inputs.expected_production_sha }}
        run: |
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ && "$BASELINE" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git fetch --no-tags origin "$CANDIDATE" "$BASELINE"
      - name: Read database identity and migration history in READ ONLY transaction
        env:
          PREFLIGHT_ENVIRONMENT: operations-backup
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          RELEASE_CANDIDATE_SHA: ${{ inputs.release_candidate_sha }}
          PRODUCTION_BACKUP_DATABASE_URL: ${{ secrets.PRODUCTION_BACKUP_DATABASE_URL }}
        run: node --import tsx scripts/operations/production-preflight-cli.ts database
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-preflight-migrations
          path: preflight-*.json
          if-no-files-found: error
          retention-days: 14
