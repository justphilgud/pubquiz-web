name: Deploy Production

# An explicit release consumes a completed Preflight. No automatic waiting deploy
# holds production-deployment while the owner is trying to run that Preflight.
on:
  workflow_dispatch:
    inputs:
      release_candidate_sha:
        description: Exact merged application SHA with successful main CI
        type: string
        required: true
      preflight_run_id:
        description: Successful protected Read-only Preflight run for this exact release
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  release-evidence:
    if: github.repository == 'justphilgud/pubquiz-web' && github.ref == 'refs/heads/main' && vars.ACTIONS_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_CANDIDATE_SHA: ${{ inputs.release_candidate_sha }}
      PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact merged main candidate CI and successful trusted Preflight run
        run: node --import tsx scripts/operations/verify-production-release.ts metadata
      - uses: actions/download-artifact@v4
        with:
          name: production-preflight-deployment
          run-id: ${{ inputs.preflight_run_id }}
          github-token: ${{ github.token }}
          path: release-evidence/deployment
      - uses: actions/download-artifact@v4
        with:
          name: production-preflight-migrations
          run-id: ${{ inputs.preflight_run_id }}
          github-token: ${{ github.token }}
          path: release-evidence/migrations
      - name: Verify all mandatory gates and exact SHA binding; bundle reviewed main guard
        run: |
          node --import tsx scripts/operations/verify-production-release.ts evidence
          npx esbuild scripts/operations/verify-production-release.ts --bundle --platform=node --format=cjs --outfile=release-evidence/release-guard.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: validated-production-release
          path: |
            release-evidence/validated.json
            release-evidence/release-guard.cjs
          if-no-files-found: error
          retention-days: 14
  deploy-production:
    needs: release-evidence
    name: Approve, migrate and deploy Production
    if: github.ref == 'refs/heads/main' && vars.ACTIONS_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOYMENT_ENV: production
      DEPLOYMENT_EVENT: workflow_dispatch
      DEPLOYMENT_REF: refs/heads/main
      DEPLOYMENT_REPOSITORY: ${{ github.repository }}
      DEPLOYMENT_SHA: ${{ inputs.release_candidate_sha }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
      EXPECTED_DATABASE_NAME: ${{ vars.EXPECTED_DATABASE_NAME }}
      EXPECTED_DATABASE_BRANCH: ${{ vars.EXPECTED_DATABASE_BRANCH }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout approved CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the immutable reviewed release guard and validated evidence
        uses: actions/download-artifact@v4
        with:
          name: validated-production-release
          path: .artifacts/release-guard
      - name: Verify fresh Production alias, baseline and exact green candidate before migrations
        env:
          RELEASE_EVIDENCE_DIR: .artifacts/release-guard
          GH_TOKEN: ${{ github.token }}
          RELEASE_CANDIDATE_SHA: ${{ inputs.release_candidate_sha }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          PRODUCTION_ALIAS: ${{ vars.PRODUCTION_ALIAS }}
        run: node .artifacts/release-guard/release-guard.cjs fresh

      - name: Validate GitHub Production database identity
        run: npm run deployment:validate

      - name: Inspect migration status before deploy
        continue-on-error: true
        run: npm run db:status

      - name: Deploy committed migrations to Production
        run: npm run db:deploy

      - name: Verify migration status after deploy
        run: npm run db:status

      - name: Build and deploy Vercel Production
        id: deploy
        shell: bash
        run: |
          deployment_url="$(npx --yes vercel@56.3.2 deploy --yes --prod --token="$VERCEL_TOKEN")"
          if [[ ! "$deployment_url" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "Vercel hat keine plausible HTTPS-Deployment-URL geliefert." >&2
            exit 1
          fi
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test Production
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          status="$(curl --silent --show-error --location --max-time 30 --retry 3 --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/")"
          if (( status < 200 || status >= 400 )); then
            echo "Production-Smoke-Test fehlgeschlagen (HTTP $status)." >&2
            exit 1
          fi

      - name: Write Production summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Commit: $DEPLOYMENT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
