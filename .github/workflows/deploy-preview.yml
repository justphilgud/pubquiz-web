name: Deploy Preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      editorial_dry_run_only:
        description: 'Read-only PR93 editorial analysis; no migrations or deployment'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: preview-deployment
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Migrate and deploy Preview
    if: >-
      vars.ACTIONS_DEPLOYMENTS_ENABLED == 'true' &&
      !inputs.editorial_dry_run_only &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'preview/content-and-quiz-flow'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/heads/') &&
          github.ref != 'refs/heads/main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      TRUSTED_PREVIEW_BRANCHES: ${{ vars.TRUSTED_PREVIEW_BRANCHES }}
      DEPLOYMENT_ENV: preview
      DEPLOYMENT_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      DEPLOYMENT_EVENT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || github.event_name }}
      DEPLOYMENT_REF: ${{ github.event_name == 'workflow_run' && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
      DEPLOYMENT_REPOSITORY: ${{ github.repository }}
      DEPLOYMENT_REPOSITORY_ID: ${{ github.repository_id }}
      DEPLOYMENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
      EXPECTED_DATABASE_NAME: ${{ vars.EXPECTED_DATABASE_NAME }}
      EXPECTED_DATABASE_BRANCH: ${{ vars.EXPECTED_DATABASE_BRANCH }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout successful CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify successful trusted push CI for the exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-preview-ci.ts

      - name: Install dependencies
        run: npm ci

      - name: Validate Vercel Preview media metadata before migrations
        run: node --import tsx scripts/deploy-vercel-git-preview.ts --check-only

      - name: Validate GitHub Preview database identity
        run: npm run deployment:validate

      - name: Inspect migration status before deploy
        continue-on-error: true
        run: npm run db:status

      - name: Deploy committed migrations to Preview
        run: npm run db:deploy

      - name: Verify migration status after deploy
        run: npm run db:status

      - name: Deploy targeted Vercel Git Preview
        id: deploy
        run: node --import tsx scripts/deploy-vercel-git-preview.ts

      - name: Smoke-test Preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          status="$(curl --silent --show-error --location --max-time 30 --retry 3 --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/")"
          if (( status < 200 || status >= 400 )); then
            echo "Preview-Smoke-Test fehlgeschlagen (HTTP $status)." >&2
            exit 1
          fi

      - name: Write Preview summary
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          {
            echo "## Preview deployment"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Deployment ID: $DEPLOYMENT_ID"
            echo "- Branch: $DEPLOYMENT_BRANCH"
            echo "- Commit: $DEPLOYMENT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  editorial-dry-run:
    name: Read-only approved editorial source analysis
    if: >-
      vars.ACTIONS_DEPLOYMENTS_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/editorial-safe-import' &&
      inputs.editorial_dry_run_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      CI: 'true'
      DEPLOYMENT_ENV: preview
      DEPLOYMENT_EVENT: workflow_dispatch
      DEPLOYMENT_REF: ${{ github.ref }}
      DEPLOYMENT_REPOSITORY: ${{ github.repository }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
      EXPECTED_DATABASE_NAME: ${{ vars.EXPECTED_DATABASE_NAME }}
      EXPECTED_DATABASE_BRANCH: ${{ vars.EXPECTED_DATABASE_BRANCH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Preview database identity
        run: npm run deployment:validate
      - name: Execute fixed READ ONLY projection
        run: node --import tsx scripts/editorial-import-dry-run.ts
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-pr93-read-only-dry-run
          path: editorial-dry-run.json
          if-no-files-found: error
          retention-days: 14
