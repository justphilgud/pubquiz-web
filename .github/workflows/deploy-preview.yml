name: Deploy Preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      isolated_shared_design:
        description: 'Use only the synthetic shared-design review database (approved AP3 branch required)'
        type: boolean
        default: false
      isolated_game_teams:
        description: 'Use only the synthetic game-team assignment review database (approved AP2 branch required)'
        type: boolean
        default: false
      isolated_games:
        description: 'Use only the synthetic standalone game review database (approved games branch required)'
        type: boolean
        default: false
      isolated_philgud:
        description: 'Use only the isolated synthetic Phil-Gud review database (Phil-Gud branch required)'
        type: boolean
        default: false
      isolated_navigation:
        description: 'Use only the isolated synthetic navigation review database (navigation branch required)'
        type: boolean
        default: false
      isolated_pr130:
        description: 'Use only the dedicated PR130 review database (PR130 branch required)'
        type: boolean
        default: false
      editorial_dry_run_only:
        description: 'Read-only PR93 editorial analysis; no migrations or deployment'
        type: boolean
        default: false
      editorial_repair_test_questions:
        description: 'Restore only approved Preview test questions 154 and 207; no import, migration or deployment'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: preview-deployment
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Migrate and deploy Preview
    # Bingo AP2 uses its separately verified synthetic database and the targeted
    # administrative Git Preview path. Never run this shared-DB migration path.
    if: >-
      vars.ACTIONS_DEPLOYMENTS_ENABLED == 'true' &&
      github.ref != 'refs/heads/codex/bingo-preparation' &&
      github.ref != 'refs/heads/codex/bingo-live-run' &&
      github.ref != 'refs/heads/codex/bingo-event-operation' &&
      !inputs.editorial_dry_run_only && !inputs.editorial_repair_test_questions &&
      (github.ref != 'refs/heads/codex/shared-game-design' || inputs.isolated_shared_design) &&
      (!inputs.isolated_shared_design || github.ref == 'refs/heads/codex/shared-game-design') &&
      (github.ref != 'refs/heads/codex/game-team-assignments' || inputs.isolated_game_teams) &&
      (!inputs.isolated_game_teams || github.ref == 'refs/heads/codex/game-team-assignments') &&
      (github.ref != 'refs/heads/codex/standalone-game-drafts' || inputs.isolated_games) &&
      (!inputs.isolated_games || github.ref == 'refs/heads/codex/standalone-game-drafts') &&
      (github.ref != 'refs/heads/codex/philgud-admin-design' || inputs.isolated_philgud) &&
      (!inputs.isolated_philgud || github.ref == 'refs/heads/codex/philgud-admin-design') &&
      (github.ref != 'refs/heads/codex/multi-event-navigation' || inputs.isolated_navigation) &&
      (!inputs.isolated_navigation || github.ref == 'refs/heads/codex/multi-event-navigation') &&
      (github.ref != 'refs/heads/codex/event-type-permissions' || inputs.isolated_pr130) &&
      (!inputs.isolated_pr130 || github.ref == 'refs/heads/codex/event-type-permissions') &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'preview/content-and-quiz-flow'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/heads/') &&
          github.ref != 'refs/heads/main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      TRUSTED_PREVIEW_BRANCHES: ${{ vars.TRUSTED_PREVIEW_BRANCHES }}
      DEPLOYMENT_ENV: preview
      DEPLOYMENT_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      DEPLOYMENT_EVENT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || github.event_name }}
      DEPLOYMENT_REF: ${{ github.event_name == 'workflow_run' && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
      DEPLOYMENT_REPOSITORY: ${{ github.repository }}
      DEPLOYMENT_REPOSITORY_ID: ${{ github.repository_id }}
      DEPLOYMENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DATABASE_URL: ${{ inputs.isolated_shared_design && secrets.SHARED_DESIGN_MIGRATION_DATABASE_URL || inputs.isolated_game_teams && secrets.GAME_TEAMS_MIGRATION_DATABASE_URL || inputs.isolated_games && secrets.GAMES_MIGRATION_DATABASE_URL || inputs.isolated_philgud && secrets.PR130_DATABASE_URL || inputs.isolated_navigation && secrets.PR130_DATABASE_URL || inputs.isolated_pr130 && secrets.PR130_DATABASE_URL || secrets.DATABASE_URL }}
      EXPECTED_DATABASE_HOST: ${{ inputs.isolated_shared_design && 'ep-dry-dust-aljik09f-pooler.c-3.eu-central-1.aws.neon.tech' || inputs.isolated_game_teams && 'ep-dry-dust-aljik09f-pooler.c-3.eu-central-1.aws.neon.tech' || inputs.isolated_games && 'ep-dry-dust-aljik09f-pooler.c-3.eu-central-1.aws.neon.tech' || inputs.isolated_philgud && 'ep-dry-dust-aljik09f-pooler.c-3.eu-central-1.aws.neon.tech' || inputs.isolated_navigation && 'ep-dry-dust-aljik09f-pooler.c-3.eu-central-1.aws.neon.tech' || inputs.isolated_pr130 && 'ep-dry-dust-aljik09f-pooler.c-3.eu-central-1.aws.neon.tech' || vars.EXPECTED_DATABASE_HOST }}
      EXPECTED_DATABASE_NAME: ${{ inputs.isolated_shared_design && 'shared_design_review_20261026' || inputs.isolated_game_teams && 'game_teams_review_20261026' || inputs.isolated_games && 'games_review_20261026c' || inputs.isolated_philgud && 'pr130_review_20261025' || inputs.isolated_navigation && 'pr130_review_20261025' || inputs.isolated_pr130 && 'pr130_review_20261025' || vars.EXPECTED_DATABASE_NAME }}
      EXPECTED_DATABASE_BRANCH: ${{ inputs.isolated_shared_design && 'dry-dust' || inputs.isolated_game_teams && 'dry-dust' || inputs.isolated_games && 'dry-dust' || inputs.isolated_philgud && 'dry-dust' || inputs.isolated_navigation && 'dry-dust' || inputs.isolated_pr130 && 'dry-dust' || vars.EXPECTED_DATABASE_BRANCH }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout successful CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify successful trusted push CI for the exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-preview-ci.ts

      - name: Install dependencies
        run: npm ci

      - name: Validate Vercel Preview media metadata before migrations
        run: node --import tsx scripts/deploy-vercel-git-preview.ts --check-only

      - name: Validate isolated shared design runtime database identity
        if: inputs.isolated_shared_design
        env:
          DATABASE_URL: ${{ secrets.SHARED_DESIGN_DATABASE_URL }}
        run: npm run deployment:validate

      - name: Validate isolated game team runtime database identity
        if: inputs.isolated_game_teams
        env:
          DATABASE_URL: ${{ secrets.GAME_TEAMS_DATABASE_URL }}
        run: npm run deployment:validate

      - name: Validate isolated game runtime database identity
        if: inputs.isolated_games
        env:
          DATABASE_URL: ${{ secrets.GAMES_DATABASE_URL }}
        run: npm run deployment:validate

      - name: Validate isolated navigation runtime database identity
        if: inputs.isolated_navigation
        env:
          DATABASE_URL: ${{ secrets.NAVIGATION_DATABASE_URL }}
        run: npm run deployment:validate

      - name: Validate isolated Phil Gud runtime database identity
        if: inputs.isolated_philgud
        env:
          DATABASE_URL: ${{ secrets.PHIL_GUD_DATABASE_URL }}
        run: npm run deployment:validate

      - name: Validate GitHub Preview database identity
        run: npm run deployment:validate

      - name: Inspect migration status before deploy
        continue-on-error: true
        run: npm run db:status

      - name: Deploy committed migrations to Preview
        run: npm run db:deploy

      - name: Verify migration status after deploy
        run: npm run db:status

      - name: Deploy targeted Vercel Git Preview
        id: deploy
        run: node --import tsx scripts/deploy-vercel-git-preview.ts

      - name: Smoke-test Preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          status="$(curl --silent --show-error --location --max-time 30 --retry 3 --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/")"
          if (( status < 200 || status >= 400 )); then
            echo "Preview-Smoke-Test fehlgeschlagen (HTTP $status)." >&2
            exit 1
          fi

      - name: Write Preview summary
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          {
            echo "## Preview deployment"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Deployment ID: $DEPLOYMENT_ID"
            echo "- Branch: $DEPLOYMENT_BRANCH"
            echo "- Commit: $DEPLOYMENT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  editorial-dry-run:
    name: Read-only approved editorial source analysis
    if: >-
      vars.ACTIONS_DEPLOYMENTS_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/editorial-safe-import' &&
      inputs.editorial_dry_run_only && !inputs.editorial_repair_test_questions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      CI: 'true'
      DEPLOYMENT_ENV: preview
      DEPLOYMENT_EVENT: workflow_dispatch
      DEPLOYMENT_REF: ${{ github.ref }}
      DEPLOYMENT_REPOSITORY: ${{ github.repository }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
      EXPECTED_DATABASE_NAME: ${{ vars.EXPECTED_DATABASE_NAME }}
      EXPECTED_DATABASE_BRANCH: ${{ vars.EXPECTED_DATABASE_BRANCH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Preview database identity
        run: npm run deployment:validate
      - name: Execute fixed READ ONLY projection
        run: node --import tsx scripts/editorial-import-dry-run.ts
      - name: Compare persisted editorial content and original legacy integrity
        run: node --import tsx scripts/editorial-import-audit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-pr93-read-only-dry-run
          path: |
            editorial-dry-run.json
            editorial-integrity-audit.json
          if-no-files-found: error
          retention-days: 14

  editorial-test-repair:
    if: vars.ACTIONS_DEPLOYMENTS_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.editorial_repair_test_questions && !inputs.editorial_dry_run_only && github.ref == 'refs/heads/codex/editorial-safe-import' && github.repository == 'justphilgud/pubquiz-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      CI: 'true'
      DEPLOYMENT_ENV: preview
      DEPLOYMENT_EVENT: workflow_dispatch
      DEPLOYMENT_REF: ${{ github.ref }}
      DEPLOYMENT_BRANCH: ${{ github.ref_name }}
      DEPLOYMENT_SHA: ${{ github.sha }}
      DEPLOYMENT_REPOSITORY: ${{ github.repository }}
      TRUSTED_PREVIEW_BRANCHES: ${{ vars.TRUSTED_PREVIEW_BRANCHES }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
      EXPECTED_DATABASE_NAME: ${{ vars.EXPECTED_DATABASE_NAME }}
      EXPECTED_DATABASE_BRANCH: ${{ vars.EXPECTED_DATABASE_BRANCH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify trusted branch and successful full CI for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-preview-ci.ts
      - run: npm ci
      - run: npm run db:generate
      - name: Verify fixed Preview database identity
        run: npm run deployment:validate
      - name: Restore only questions 154 and 207 with atomic integrity proof
        run: node --import tsx scripts/editorial-test-question-repair.ts
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-test-question-repair
          path: editorial-test-question-repair.json
          if-no-files-found: error
          retention-days: 14
