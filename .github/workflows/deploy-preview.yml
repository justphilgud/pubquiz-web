name: Deploy Preview

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: preview-deployment
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Migrate and deploy Preview
    if: >-
      vars.ACTIONS_DEPLOYMENTS_ENABLED == 'true' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'preview/content-and-quiz-flow'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/codex/quiz-purpose-preview-ops'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      DEPLOYMENT_ENV: preview
      DEPLOYMENT_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      DEPLOYMENT_EVENT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || github.event_name }}
      DEPLOYMENT_REF: ${{ github.event_name == 'workflow_run' && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}
      DEPLOYMENT_REPOSITORY: ${{ github.repository }}
      DEPLOYMENT_REPOSITORY_ID: ${{ github.repository_id }}
      DEPLOYMENT_SHA: 1c195103fc0f7aeda561638798a10cd2fd552471
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_DATABASE_HOST: ${{ vars.EXPECTED_DATABASE_HOST }}
      EXPECTED_DATABASE_NAME: ${{ vars.EXPECTED_DATABASE_NAME }}
      EXPECTED_DATABASE_BRANCH: ${{ vars.EXPECTED_DATABASE_BRANCH }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout successful CI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate GitHub Preview database identity
        run: npm run deployment:validate

      - name: Verify existing Preview migration status without applying migrations
        run: npm run db:status
      - name: Verify purpose schema and create one explicitly technical acceptance quiz
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const c=new pg.Client({connectionString:process.env.DATABASE_URL}); await c.connect();
          try {
            await c.query('BEGIN');
            const schema=await c.query(`SELECT is_nullable,column_default FROM information_schema.columns WHERE table_schema='pubquiz' AND table_name='quiz' AND column_name='purpose'`);
            if(schema.rows[0]?.is_nullable!=='NO'||!schema.rows[0]?.column_default?.includes('REGULAR')) throw new Error('PURPOSE_SCHEMA_INVALID');
            const owner=await c.query('SELECT eventreihe_id FROM pubquiz.quiz WHERE quiz_id=89');
            if(owner.rows[0]?.eventreihe_id!==4) throw new Error('ISOLATED_OWNER_INVALID');
            const exists=await c.query(`SELECT quiz_id FROM pubquiz.quiz WHERE titel='PURPOSE-PR91-BUILD TEST'`);
            if(exists.rowCount) throw new Error('FIXTURE_ALREADY_EXISTS');
            const q=await c.query(`INSERT INTO pubquiz.quiz(eventreihe_id,titel,quiz_datum,purpose,team_anzahl,teilnehmer_anzahl) VALUES(4,'PURPOSE-PR91-BUILD TEST',CURRENT_DATE,'TEST',0,0) RETURNING quiz_id,purpose`);
            const b=await c.query(`INSERT INTO pubquiz.quiz_abschnitte(quiz_id,titel,abschnitt_typ,sortierung) VALUES($1,'Intro','intro',0),($1,'Fragenblock 1','fragenblock',1),($1,'Outro','outro',2) RETURNING quiz_abschnitt_id`,[q.rows[0].quiz_id]);
            await c.query('COMMIT');console.log(JSON.stringify({purposeSchema:schema.rows,technicalCreation:q.rows,blocks:b.rows}));
          } catch(e) {await c.query('ROLLBACK'); throw e;} finally {await c.end();}
          NODE
