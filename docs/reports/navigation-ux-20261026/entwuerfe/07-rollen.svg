<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768" role="img" aria-labelledby="t"><title id="t">Entwurf: berechtigte Rollenunterschiede bei stabilen Einstiegen</title><style>text{font-family:Arial,sans-serif;fill:#17242b}</style><rect width="1366" height="768" fill="#f5f7f7"/><text x="28" y="42" font-size="24" font-weight="700">ENTWURF · Rollen unterscheiden sich, Seitenwechsel bauen das Menü nicht um</text><text x="28" y="109" font-size="17" font-weight="700">Administrator</text><rect x="270" y="85" width="1068" height="44" rx="6" fill="white" stroke="#cbd5d9"/><text x="286" y="113" font-size="17">Quiz · Bingo · PowerPoint-Karaoke · Eventreihen · Administration</text><text x="1248" y="113" font-size="15">Konto ▾</text><text x="286" y="157" font-size="14">Konto bleibt an derselben Stelle. Alle Ziele nach ihren bestehenden Regeln.</text><text x="28" y="217" font-size="17" font-weight="700">Eventmanager</text><rect x="270" y="193" width="1068" height="44" rx="6" fill="white" stroke="#cbd5d9"/><text x="286" y="221" font-size="17">Quiz · Bingo · PowerPoint-Karaoke · Eventreihen</text><text x="1248" y="221" font-size="15">Konto ▾</text><text x="286" y="265" font-size="14">Beispiel: passende Produktfreischaltungen. Gemeinsame Bearbeitung nur mit separatem V.</text><text x="28" y="325" font-size="17" font-weight="700">Reiheneditor</text><rect x="270" y="301" width="1068" height="44" rx="6" fill="white" stroke="#cbd5d9"/><text x="286" y="329" font-size="17">Quiz · Bingo · Eventreihen</text><text x="1248" y="329" font-size="15">Konto ▾</text><text x="286" y="373" font-size="14">Keine Karaoke-Editorfunktionen, keine Quizveranstaltungs- oder Teamverwaltung.</text><text x="28" y="433" font-size="17" font-weight="700">Globaler Quiz-Editor</text><rect x="270" y="409" width="1068" height="44" rx="6" fill="white" stroke="#cbd5d9"/><text x="286" y="437" font-size="17">Quiz</text><text x="1248" y="437" font-size="15">Konto ▾</text><text x="286" y="481" font-size="14">Inhalte nach bestehenden Global-/Objektrechten; keine erfundene Reihenzuordnung.</text><text x="28" y="541" font-size="17" font-weight="700">Nur Reihenverwaltung</text><rect x="270" y="517" width="1068" height="44" rx="6" fill="white" stroke="#cbd5d9"/><text x="286" y="545" font-size="17">Eventreihen</text><text x="1248" y="545" font-size="15">Konto ▾</text><text x="286" y="589" font-size="14">Stammdaten und Logo ohne Spielrolle. Keine Produkte freischalten.</text><text x="28" y="649" font-size="17" font-weight="700">Ohne Arbeitsrechte</text><rect x="270" y="625" width="1068" height="44" rx="6" fill="white" stroke="#cbd5d9"/><text x="286" y="653" font-size="17">Kein Arbeitsmenü</text><text x="1248" y="653" font-size="15">Konto ▾</text><text x="286" y="697" font-size="14">Konto / Hilfe und klare Leerseite statt unberechtigter Formatangebote.</text></svg>