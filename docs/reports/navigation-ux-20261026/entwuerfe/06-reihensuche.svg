<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670"><title>Entwurf: Reihenfilter für 110 berechtigte Reihen</title><style>text{font-family:Arial,sans-serif}</style><rect x="0" y="0" width="720" height="670" rx="0" fill="#f5f7f7" stroke="#f5f7f7"/><text x="24" y="40" font-size="20" font-weight="700" fill="#17242b">ENTWURF · lokaler Reihenfilter</text><text x="24" y="78" font-size="16" font-weight="400" fill="#17242b">Quiz → Inhalte bleibt während der Auswahl aktiv.</text><rect x="24" y="108" width="540" height="46" rx="7" fill="white" stroke="#cbd5d9"/><text x="40" y="138" font-size="17" font-weight="600" fill="#17242b">Eventreihe: Alle erlaubten Reihen ▾</text><rect x="24" y="164" width="540" height="420" rx="7" fill="white" stroke="#cbd5d9"/><text x="40" y="196" font-size="13" font-weight="600" fill="#17242b">Eventreihen durchsuchen</text><rect x="40" y="210" width="508" height="44" rx="7" fill="white" stroke="#cbd5d9"/><text x="54" y="239" font-size="17" font-weight="400" fill="#17242b">Navigation QA</text><text x="40" y="280" font-size="14" font-weight="400" fill="#52636c">110 passende Reihen · Liste separat scrollbar</text><text x="40" y="322" font-size="16" font-weight="400" fill="#17242b">Navigation QA 001 – sehr langer Name …</text><text x="40" y="360" font-size="16" font-weight="400" fill="#17242b">Navigation QA 002</text><text x="40" y="398" font-size="16" font-weight="400" fill="#17242b">Navigation QA 003</text><text x="40" y="436" font-size="16" font-weight="400" fill="#17242b">Navigation QA 004</text><text x="40" y="474" font-size="16" font-weight="400" fill="#17242b">Navigation QA 005</text><text x="40" y="512" font-size="16" font-weight="400" fill="#17242b">Navigation QA 006</text><rect x="534" y="301" width="6" height="258" rx="3" fill="#f5f7f7" stroke="#f5f7f7"/><rect x="534" y="301" width="6" height="30" rx="3" fill="#52636c" stroke="#52636c"/><text x="24" y="625" font-size="15" font-weight="400" fill="#17242b">Tab