<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768" role="img" aria-labelledby="title desc"><title id="title">Entwurf: Noch nicht spielbares Format, Laptop</title><desc id="desc">Statischer Vorschlag. Feste Hauptnavigation; keine Backendaktionen, keine neue Berechtigung. Dargestellt ist die Adminrolle.</desc><style>text{font-family:Arial,Helvetica,sans-serif} </style><rect x="0" y="0" width="1366" height="768" rx="0" fill="#f5f7f7" stroke="#f5f7f7"/><rect x="0" y="0" width="1366" height="76" rx="0" fill="white" stroke="white"/><text x="28" y="44" font-size="24" font-weight="700" fill="#17242b">Phil Gud</text><text x="190" y="44" font-size="17" font-weight="400" fill="#17242b">Quiz</text><rect x="278" y="18" width="110" height="42" rx="7" fill="#e8f4ef" stroke="#e8f4ef"/><text x="290" y="44" font-size="17" font-weight="700" fill="#17242b">Bingo</text><text x="400" y="44" font-size="17" font-weight="400" fill="#17242b">PowerPoint-Karaoke</text><text x="680" y="44" font-size="17" font-weight="400" fill="#17242b">Eventreihen</text><text x="880" y="44" font-size="17" font-weight="400" fill="#17242b">Administration</text><text x="1240" y="44" font-size="16" font-weight="400" fill="#17242b">Konto ▾</text><path d="M0 76h1366" stroke="#cbd5d9"/><text x="28" y="105" font-size="12" font-weight="600" fill="#52636c">ENTWURF · Admin · keine Produktoberfläche</text><path d="M0 128h1366" stroke="#cbd5d9"/><text x="40" y="184" font-size="30" font-weight="700" fill="#17242b">Bingo</text><text x="40" y="220" font-size="13" font-weight="600" fill="#52636c">Eventreihe</text><rect x="40" y="232" width="540" height="47" rx="7" fill="white" stroke="#cbd5d9"/><text x="54" y="262" font-size="16" font-weight="400" fill="#17242b">Navigation QA 001 – sehr langer Name …  ▾</text><text x="608" y="261" font-size="14" font-weight="400" fill="#52636c">Filter der aktuellen Sammlung · Hauptmenü bleibt gleich</text><rect x="40" y="320" width="1284" height="267" rx="7" fill="white" stroke="#cbd5d9"/><text x="72" y="374" font-size="30" font-weight="700" fill="#17242b">Bingo</text><text x="72" y="425" font-size="23" font-weight="700" fill="#006b56">Noch nicht verfügbar</text><text x="72" y="468" font-size="18" font-weight="400" fill="#17242b">Diese Eventart ist freigeschaltet; Spielfunktionen sind noch nicht implementiert.</text><text x="72" y="510" font-size="16" font-weight="400" fill="#52636c">Keine Erstellen- oder Starten-Aktion. Quiz und gemeinsame Verwaltung bleiben erreichbar.</text><text x="40" y="742" font-size="13" font-weight="400" fill="#52636c">Nur Navigationsentwurf · unveränderte Rollen und Produktprüfungen · keine Live-Änderungen</text></svg>