<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768" role="img" aria-labelledby="title desc"><title id="title">Entwurf: Reiheneinstellungen, Laptop</title><desc id="desc">Statischer Vorschlag. Feste Hauptnavigation; keine Backendaktionen, keine neue Berechtigung. Dargestellt ist die Adminrolle.</desc><style>text{font-family:Arial,Helvetica,sans-serif} </style><rect x="0" y="0" width="1366" height="768" rx="0" fill="#f5f7f7" stroke="#f5f7f7"/><rect x="0" y="0" width="1366" height="76" rx="0" fill="white" stroke="white"/><text x="28" y="44" font-size="24" font-weight="700" fill="#17242b">Phil Gud</text><text x="190" y="44" font-size="17" font-weight="400" fill="#17242b">Quiz</text><text x="290" y="44" font-size="17" font-weight="400" fill="#17242b">Bingo</text><text x="400" y="44" font-size="17" font-weight="400" fill="#17242b">PowerPoint-Karaoke</text><rect x="668" y="18" width="110" height="42" rx="7" fill="#e8f4ef" stroke="#e8f4ef"/><text x="680" y="44" font-size="17" font-weight="700" fill="#17242b">Eventreihen</text><text x="880" y="44" font-size="17" font-weight="400" fill="#17242b">Administration</text><text x="1240" y="44" font-size="16" font-weight="400" fill="#17242b">Konto ▾</text><path d="M0 76h1366" stroke="#cbd5d9"/><text x="28" y="105" font-size="12" font-weight="600" fill="#52636c">ENTWURF · Admin · keine Produktoberfläche</text><text x="370" y="108" font-size="15" font-weight="400" fill="#52636c">Eventreihenübersicht</text><text x="565" y="108" font-size="15" font-weight="700" fill="#006b56">Stammdaten &amp; Logo</text><path d="M0 128h1366" stroke="#cbd5d9"/><text x="40" y="184" font-size="30" font-weight="700" fill="#17242b">Eventreihe verwalten</text><text x="40" y="224" font-size="15" font-weight="400" fill="#52636c">Eventreihen / Eventreihe 001</text><text x="40" y="259" font-size="19" font-weight="400" fill="#17242b">Navigation QA 001 – sehr langer Name einer gemeinsamen Eventreihe für Quiz, Bingo und Karaoke</text><rect x="40" y="314" width="800" height="123" rx="7" fill="white" stroke="#cbd5d9"/><text x="60" y="350" font-size="21" font-weight="700" fill="#17242b">Stammdaten &amp; Logo</text><text x="60" y="382" font-size="16" font-weight="400" fill="#17242b">Öffentlicher Name · Beschreibung · Reservierungslink · Logo</text><text x="60" y="413" font-size="14" font-weight="400" fill="#52636c">Bearbeiten nur mit eigenständigem Verwaltungsrecht oder als Admin.</text><rect x="40" y="457" width="800" height="108" rx="7" fill="white" stroke="#cbd5d9"/><text x="60" y="493" font-size="21" font-weight="700" fill="#17242b">Eventarten</text><text x="60" y="527" font-size="16" font-weight="400" fill="#17242b">Quiz, Bingo, PowerPoint-Karaoke · Freischaltung nur Admin</text><rect x="40" y="584" width="800" height="108" rx="7" fill="white" stroke="#cbd5d9"/><text x="60" y="620" font-size="21" font-weight="700" fill="#17242b">Quiz-Vorgaben</text><text x="60" y="654" font-size="16" font-weight="400" fill="#17242b">Bestehender Standard für Präsentation und Antwortformular</text><text x="890" y="356" font-size="18" font-weight="700" fill="#006b56">Gemeinsam</text><text x="890" y="389" font-size="16" font-weight="400" fill="#17242b">Logo und Stammdaten gehören zur Reihe.</text><text x="890" y="414" font-size="16" font-weight="400" fill="#17242b">Templates bleiben formatspezifisch.</text><text x="890" y="497" font-size="18" font-weight="700" fill="#17242b">Zugriff</text><text x="890" y="531" font-size="16" font-weight="400" fill="#17242b">Benutzerzuordnungen werden weiterhin</text><text x="890" y="556" font-size="16" font-weight="400" fill="#17242b">beim Benutzer gepflegt.</text><text x="890" y="619" font-size="16" font-weight="600" fill="#006b56">Zur Benutzerverwaltung →</text><text x="40" y="742" font-size="13" font-weight="400" fill="#52636c">Nur Navigationsentwurf · unveränderte Rollen und Produktprüfungen · keine Live-Änderungen</text></svg>