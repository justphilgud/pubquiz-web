<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Entwurf: Noch nicht spielbares Format, Mobil</title><desc id="desc">Statischer Vorschlag. Feste Hauptnavigation; keine Backendaktionen, keine neue Berechtigung. Dargestellt ist die Adminrolle.</desc><style>text{font-family:Arial,Helvetica,sans-serif} </style><rect x="0" y="0" width="390" height="844" rx="0" fill="#f5f7f7" stroke="#f5f7f7"/><rect x="0" y="0" width="390" height="58" rx="0" fill="white" stroke="white"/><text x="16" y="35" font-size="19" font-weight="700" fill="#17242b">Phil Gud</text><text x="288" y="35" font-size="14" font-weight="600" fill="#17242b">Konto ▾</text><path d="M0 58h390" stroke="#cbd5d9"/><rect x="16" y="74" width="358" height="42" rx="7" fill="#e8f4ef" stroke="#e8f4ef"/><text x="30" y="101" font-size="17" font-weight="700" fill="#006b56">Bingo · Hauptmenü ▾</text><text x="16" y="197" font-size="11" font-weight="600" fill="#52636c">ENTWURF · Admin</text><text x="16" y="234" font-size="23" font-weight="700" fill="#17242b">Bingo</text><text x="16" y="268" font-size="12" font-weight="600" fill="#52636c">Eventreihe · Sammlungsfilter</text><rect x="16" y="282" width="358" height="66" rx="7" fill="white" stroke="#cbd5d9"/><text x="28" y="307" font-size="15" font-weight="600" fill="#17242b">Navigation QA 001 – sehr langer … ▾</text><text x="28" y="333" font-size="12" font-weight="400" fill="#52636c">Suche in 100+ erlaubten Reihen</text><rect x="16" y="375" width="358" height="259" rx="7" fill="white" stroke="#cbd5d9"/><text x="32" y="416" font-size="22" font-weight="700" fill="#006b56">Noch nicht verfügbar</text><text x="32" y="457" font-size="16" font-weight="400" fill="#17242b">Für diese freigeschaltete Eventart</text><text x="32" y="482" font-size="16" font-weight="400" fill="#17242b">gibt es noch keine Spielfunktionen.</text><text x="32" y="550" font-size="15" font-weight="400" fill="#17242b">Quiz und Eventreihen bleiben im</text><text x="32" y="573" font-size="15" font-weight="400" fill="#17242b">gleichen Hauptmenü erreichbar.</text><text x="16" y="825" font-size="11" font-weight="400" fill="#52636c">Statischer Vorschlag · keine Backendaktionen</text></svg>