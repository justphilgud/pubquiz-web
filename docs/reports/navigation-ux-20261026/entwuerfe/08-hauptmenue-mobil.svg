<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t"><title id="t">Entwurf: offenes Hauptmenü mobil, Admin</title><style>text{font-family:Arial,sans-serif;fill:#17242b}</style><rect width="390" height="844" fill="#f5f7f7"/><text x="16" y="36" font-size="19" font-weight="700">Phil Gud</text><text x="288" y="36" font-size="14">Konto ▾</text><text x="16" y="86" font-size="12">ENTWURF · Hauptmenü geöffnet</text><rect x="16" y="112" width="358" height="52" rx="6" fill="#e8f4ef" stroke="#cbd5d9"/><text x="32" y="145" font-size="18">Quiz</text><rect x="16" y="177" width="358" height="52" rx="6" fill="white" stroke="#cbd5d9"/><text x="32" y="210" font-size="18">Bingo</text><rect x="16" y="242" width="358" height="52" rx="6" fill="white" stroke="#cbd5d9"/><text x="32" y="275" font-size="18">PowerPoint-Karaoke</text><rect x="16" y="307" width="358" height="52" rx="6" fill="white" stroke="#cbd5d9"/><text x="32" y="340" font-size="18">Eventreihen</text><rect x="16" y="372" width="358" height="52" rx="6" fill="white" stroke="#cbd5d9"/><text x="32" y="405" font-size="18">Administration</text><text x="16" y="500" font-size="15">Gleiche Hauptpunkte wie am Laptop.</text><text x="16" y="530" font-size="15">Ein Reihenfilter baut diese Liste nicht um.</text><text x="16" y="582" font-size="15">Berechtigungen bestimmen die Einträge.</text><text x="16" y="612" font-size="15">Rechteentzug wird serverseitig geprüft.</text><text x="16" y="690" font-size="14">Escape schließt; Fokus kehrt zum</text><text x="16" y="715" font-size="14">benannten Hauptmenü zurück.</text><text x="16" y="817" font-size="11">Statische Ansicht · keine Backendaktionen</text></svg>